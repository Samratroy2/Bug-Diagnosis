<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BugAI - Bug Submission</title>

    <link rel="stylesheet" href="../sidebar.css">
    <link rel="stylesheet" href="bug-submission.css">
</head>

<body>

<div id="sidebar-container"></div>

<main>

    <header>
        <h1>Bug Submission</h1>
        <p>Submit a software defect for intelligent diagnosis.</p>
    </header>


    <!-- =====================================================
         BUG SUBMISSION FORM
         ===================================================== -->

    <section class="card">

        <form id="bugForm">

            <!-- =================================================
                 BUG TITLE
                 ================================================= -->

            <div class="form-group">

                <label for="bugTitle">
                    Bug Title *
                </label>

                <input
                    id="bugTitle"
                    type="text"
                    required
                    placeholder="Example: Application crashes during login"
                >

            </div>


            <!-- =================================================
                 PROJECT
                 ================================================= -->

            <div class="form-group">

                <label for="project">
                    Project
                </label>

                <select id="project">

                    <option value="Mozilla">
                        Mozilla
                    </option>

                    <option value="Apache">
                        Apache
                    </option>

                    <option value="Eclipse">
                        Eclipse
                    </option>

                    <option value="Custom Project" selected>
                        Custom Project
                    </option>

                </select>

            </div>


            <!-- =================================================
                 SEVERITY
                 ================================================= -->

            <div class="form-group">

                <label for="severity">
                    Severity
                </label>

                <select id="severity">

                    <option value="">
                        Select Severity
                    </option>

                    <option value="Critical">
                        Critical
                    </option>

                    <option value="High">
                        High
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Low">
                        Low
                    </option>

                </select>

            </div>


            <!-- =================================================
                 PRIORITY
                 ================================================= -->

            <div class="form-group">

                <label for="priority">
                    Priority
                </label>

                <select id="priority">

                    <option value="">
                        Select Priority
                    </option>

                    <option value="P1">
                        P1 - Critical
                    </option>

                    <option value="P2">
                        P2 - High
                    </option>

                    <option value="P3">
                        P3 - Medium
                    </option>

                    <option value="P4">
                        P4 - Low
                    </option>

                </select>

            </div>


            <!-- =================================================
                 COMPONENT
                 ================================================= -->

            <div class="form-group">

                <label for="component">
                    Affected Component
                </label>

                <select id="component">

                    <option value="">
                        Select Component
                    </option>

                    <option value="Authentication">
                        Authentication
                    </option>

                    <option value="Database">
                        Database
                    </option>

                    <option value="UI / Frontend">
                        UI / Frontend
                    </option>

                    <option value="Backend / API">
                        Backend / API
                    </option>

                    <option value="Networking">
                        Networking
                    </option>

                    <option value="Payment">
                        Payment
                    </option>

                    <option value="Reporting">
                        Reporting
                    </option>

                    <option value="Image Processing">
                        Image Processing
                    </option>

                    <option value="Memory Management">
                        Memory Management
                    </option>

                    <option value="Indexing / Search">
                        Indexing / Search
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- =================================================
                 BUG DESCRIPTION
                 ================================================= -->

            <div class="form-group">

                <label for="description">
                    Bug Description *
                </label>

                <textarea
                    id="description"
                    rows="6"
                    required
                    placeholder="Describe the problem, expected behaviour and actual behaviour..."
                ></textarea>

            </div>


            <!-- =================================================
                 STACK TRACE
                 ================================================= -->

            <div class="form-group">

                <label for="stackTrace">
                    Stack Trace / Error Logs
                </label>

                <textarea
                    id="stackTrace"
                    rows="8"
                    placeholder="Paste stack trace or application error logs here..."
                ></textarea>

            </div>


            <!-- =================================================
                 LOG FILE UPLOAD
                 ================================================= -->

            <div class="form-group">

                <label for="logFile">
                    Attach Log File
                </label>

                <div
                    id="dropZone"
                    class="upload-zone"
                >

                    <strong>
                        Drop your file here
                    </strong>

                    <p>
                        or click to browse
                    </p>

                    <small>
                        TXT, LOG, JSON or CSV — Maximum 10 MB
                    </small>

                    <input
                        id="logFile"
                        type="file"
                        accept=".txt,.log,.json,.csv"
                    >

                </div>

                <div id="fileInfo"></div>

            </div>


            <!-- =================================================
                 ACTIONS
                 ================================================= -->

            <div class="actions">

                <button
                    type="button"
                    class="secondary"
                    id="resetBtn"
                >
                    Reset
                </button>

                <button
                    type="submit"
                    class="primary"
                >
                    Analyze Bug
                </button>

            </div>

        </form>

    </section>


    <!-- =====================================================
         ANALYSIS RESULT
         ===================================================== -->

    <section
        id="result"
        class="card result hidden"
    ></section>

</main>


<!-- =========================================================
     SCRIPTS
     ========================================================= -->

<script src="../sidebar.js"></script>

<script src="bug-submission.js"></script>

</body>

</html>
