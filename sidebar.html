<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BugAI — Sidebar</title>

    <link
        rel="stylesheet"
        href="sidebar.css"
    >

</head>


<body>
    <!-- =========================================================
        BUGAI — SHARED SIDEBAR
    ========================================================= -->

    <aside
        id="bugaiSidebar"
        class="bugai-sidebar"
    >

        <!-- =====================================================
            LOGO / BRAND
        ====================================================== -->

        <div class="sidebar-brand">

            <div class="brand-text">

                <div class="brand-name">
                    BugAI
                </div>

                <div class="brand-subtitle">
                    Intelligent Bug Diagnosis
                </div>

            </div>

        </div>


        <!-- =====================================================
            NAVIGATION
        ====================================================== -->

        <nav class="sidebar-navigation">

            <!-- =================================================
                MAIN
            ================================================== -->

            <div class="navigation-label">
                MAIN
            </div>


            <!-- Dashboard -->

            <a
                href="/Dashboard/dashboard.html"
                class="sidebar-link"
                data-page="dashboard"
            >
                <span class="nav-icon">▦</span>

                <span class="nav-text">
                    Dashboard
                </span>
            </a>


            <!-- Bug Submission -->

            <a
                href="/Bug-Submission/bug-submission.html"
                class="sidebar-link"
                data-page="bug-submission"
            >
                <span class="nav-icon">＋</span>

                <span class="nav-text">
                    Bug Submission
                </span>
            </a>


            <!-- Workflow -->

            <a
                href="/Workflow/workflow.html"
                class="sidebar-link"
                data-page="workflow"
            >
                <span class="nav-icon">⇄</span>

                <span class="nav-text">
                    Workflow
                </span>
            </a>


            <!-- Architecture -->

            <a
                href="/Architecture/architecture.html"
                class="sidebar-link"
                data-page="architecture"
            >
                <span class="nav-icon">⌘</span>

                <span class="nav-text">
                    Architecture
                </span>
            </a>


            <!-- =================================================
                INTELLIGENCE
            ================================================== -->

            <div class="navigation-label navigation-label-spaced">
                INTELLIGENCE
            </div>


            <!-- Knowledge Base -->

            <a
                href="/Knowledge-Base/knowledge-base.html"
                class="sidebar-link"
                data-page="knowledge-base"
            >
                <span class="nav-icon">▤</span>

                <span class="nav-text">
                    Knowledge Base
                </span>
            </a>


            <!-- Semantic Similarity -->

            <a
                href="/Semantic-Similarity/similarity.html"
                class="sidebar-link"
                data-page="similarity"
            >
                <span class="nav-icon">⌕</span>

                <span class="nav-text">
                    Semantic Similarity
                </span>
            </a>


            <!-- M2 / M3 Validation -->

            <a
                href="/Validation/validation.html"
                class="sidebar-link"
                data-page="validation"
            >
                <span class="nav-icon">✓</span>

                <span class="nav-text">
                    M2 / M3 Validation
                </span>
            </a>


            <!-- Defect Analytics -->

            <a
                href="/analytics/analytics.html"
                class="sidebar-link"
                data-page="analytics"
            >
                <span class="nav-icon">▥</span>

                <span class="nav-text">
                    Defect Analytics
                </span>
            </a>


            <!-- =================================================
                SYSTEM
            ================================================== -->

            <div class="navigation-label navigation-label-spaced">
                SYSTEM
            </div>


            <!-- Settings -->

            <a
                href="/Settings/settings.html"
                class="sidebar-link"
                data-page="settings"
            >
                <span class="nav-icon">⚙</span>

                <span class="nav-text">
                    Settings
                </span>
            </a>

        </nav>


        <!-- =====================================================
            SIDEBAR FOOTER
        ====================================================== -->

        <div class="sidebar-footer">

            <div class="sidebar-status">

                <span class="status-dot"></span>

                <div class="status-text">

                    <strong>
                        System Online
                    </strong>

                </div>

            </div>


            <div class="sidebar-version">
                BugAI v1.0
            </div>

        </div>

    </aside>


    <!-- =========================================================
        MOBILE MENU BUTTON
    ========================================================= -->

    <button
        id="sidebarMenuButton"
        class="sidebar-menu-button"
        type="button"
        aria-label="Open navigation menu"
        aria-controls="bugaiSidebar"
        aria-expanded="false"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- =========================================================
        MOBILE OVERLAY
    ========================================================= -->

    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
    ></div>

        <!-- =========================================================
            SIDEBAR JAVASCRIPT
    ========================================================== -->

    <script src="sidebar.js"></script>

</body>

</html>
